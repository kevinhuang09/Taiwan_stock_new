name: Daily Taiwan Dividend Report

on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = 台灣時間 09:00
  workflow_dispatch:

jobs:
  daily-dividend-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/taiwan-stock"
          claude_args: "--max-turns 30 --allowedTools 'Bash,Write,WebSearch,WebFetch'"

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/kevinhuang09/Taiwan_stock_new.git
          git add .
          git commit -m "Daily dividend report $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
